<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArasakaNet</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.png">

</head>
<body>
    <div id ="loadingScreen">
        <div class="wrapperL"><p class="Lstatus">it's alive.</p></div>
    </div>
    <div class="Owindow" id="outlinemain">
        <div class="windowheader" id="outlineheader"><p style="margin-right:auto">S.Y.S !NFO</p><p class="openbutton" id="outlineopen" >-</p><p id="outlineclose">x</p></div>
        <div><img class="insidewindow" id="outline" src="Welcome Screen.png" draggable="false"></div>
    </div>

    <div class="window" id="nasa" style="display:none" >
        <div class="windowheader" id="nasaheader"><p style="margin-right:auto">Nasa Control Panel</p><p class="openbutton" id="nasaopen" >-</p><p id="nasaclose">x</p></div>
            <div class="gallery-container">
                <a href="https://www.nasa.gov/" target="_blank">
                    <img src="nasa2.png" alt="Nasa" class="gallery-card" />
                </a>
                <a href="https://api.nasa.gov/" target="_blank">
                    <img src="API.png" alt="API" class="gallery-card3" />
                </a>
                <a href="https://stardance.hackclub.com/home" target="_blank">
                    <img src="stardance.png" alt="Stardance"  class="gallery-card"/>
                </a>
            </div>
            <div class="gallery-container2">
                <a href="https://www.spaceappschallenge.org/" target="_blank">
                    <img src="spaceapp.png" alt="SpaceApps" class="gallery-card2" />
                </a>
        </div>
    </div>

    <div class="window" id="starnic" style="display:none">
        <div class="windowheader" id="starnicheader"><p style="margin-right:auto">Starnic</p><p class="openbutton" id="starnicopen" >-</p><p id="starnicclose">x</p></div>
                <canvas id="dinoboard"></canvas>
    </div>

        <div class="window" id="timer" style="display:none" >
        <div class="windowheader" id="timerheader"><p style="margin-right:auto">C0untdown</p><p class="openbutton" id="timeropen" >-</p><p id="timerclose">x</p></div>
            <div class="timercontainer">
                <div class="inputcontainer">
                    <input type="number" id="minutes" min="1" max="999" value="5" placeholder="Min">
                    <button id="setTimeB">Set Time</button>
                </div>

                <div class="timedisplay" id="display">05:00</div>
        
                <div class="BControl">
                    <button id="startB">Start</button>
                    <button id="pauseB">Pause</button>
                    <button id="resetB">Reset</button>
                </div>
            </div>
        </div>
    </div>
        </div>
    </div>




   <div class="notewindow" id="quickNote" style="display:none">
        <div class="windowheader" id="quickNoteheader"><p style="margin-right:auto">Quick note.</p><p class="openbutton" id="noteopen" >-</p><p id="noteclose">x</p></div>
        <header>
        <h1>Quick note.</h1>
        <div>
            <button class ="add-note-btn" onclick="openNoteDialog()">+ Add Note</button>
        </div>
    </header>

    <main id="notesContainer" class="notes-grid"></main>

    <dialog id="noteDialog">
        <div class="dialog-content">
        <div class="dialog-header">
        <h2 class="dialog-title" id="dialogTitle"> Add new Note</h2>
        <button class="close-btn" onclick="closeNoteDialog()">x</button>
        </div>

        <form id="noteForm">
            <div class="form-group">
            <label for="noteContent" class="form-label">Title</label>
            <input type="text" id="noteTitle" class="form-input" placeholder="Write that crazy title..." required>
            </div>

            <div class="form-group">
                <label for="noteContent" class="form-label">Content</label>
                <textarea id="noteContent" class="form-textarea" placeholder="Write your crazy thoughts here..." required></textarea>
            </div>

            <div class="dialog-actions">
                <button type="button" class="cancel-btn" onclick="closeNoteDialog()">Cancel</button>
                <button type="submit" class="save-btn">Save Note</button>
            </div>
        </form>

        </div>
    </dialog>
        </div>
    </div>





        <div id="sidebar">
        <div class="sidebar-icons" id="sidebar-screen">
                <div class="desktopApps">
                    <img id="nasaapp" src="nasa.png">
                </div>
                <div class="desktopApps">
                    <img id="timerapp" src="timer.png">
                </div>
                <div class="desktopApps">
                    <img id="starnicapp" src="starnicapp.png">
                </div>
                <div class="desktopApps">
                    <img id="noteapp" src="QuickNote.png">
                </div>
        </div>
    </div>

    <div id="topbar">
        <div id="logo-space"><img src="favicon.png" id="logo"></div>
        <div id="time-space"><p id="time">6/21/2023 3:41 PM</p></div>

    <script src="script.js"></script>
</body>
</html>
