<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArasakaNet</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.png">

</head>
<body>
    <div class="window" id="outlinemain">
        <div class="windowheader" id="outlineheader"><p style="margin-right:auto">S.Y.S !NFO</p><p class="openbutton" id="outlineopen" >-</p><p id="outlineclose">x</p></div>
        <div><img class="insidewindow" id="outline" src="Welcome Screen.png" draggable="false"></div>
    </div>

    <div class="window" id="nasa" style="display:none" >
        <div class="windowheader" id="nasaheader"><p style="margin-right:auto">Nasa Control Panel</p><p class="openbutton" id="nasaopen" >-</p><p id="nasaclose">x</p></div>
            <div class="gallery-container">
                <a href="https://www.nasa.gov/" target="_blank">
                    <img src="nasa2.png" alt="Nasa" class="gallery-card" />
                </a>
                <a href="https://api.nasa.gov/" target="_blank">
                    <img src="API.png" alt="API" class="gallery-card3" />
                </a>
                <a href="https://stardance.hackclub.com/home" target="_blank">
                    <img src="stardance.png" alt="Stardance"  class="gallery-card"/>
                </a>
            </div>
            <div class="gallery-container2">
                <a href="https://www.spaceappschallenge.org/" target="_blank">
                    <img src="spaceapp.png" alt="SpaceApps" class="gallery-card2" />
                </a>
        </div>
    </div>

        <div class="window" id="timer" style="display:none" >
        <div class="windowheader" id="timerheader"><p style="margin-right:auto">C0untdown</p><p class="openbutton" id="timeropen" >-</p><p id="timerclose">x</p></div>
            <div class="timercontainer">
                <div class="inputcontainer">
                    <input type="number" id="minutes" min="1" max="999" value="5" placeholder="Min">
                    <button id="setTimeB">Set Time</button>
                </div>

                <div class="timedisplay" id="display">05:00</div>
        
                <div class="BControl">
                    <button id="startB">Start</button>
                    <button id="pauseB">Pause</button>
                    <button id="resetB">Reset</button>
                </div>
            </div>
        </div>
    </div>
        </div>
    </div>

        <div class="scontainer">
            <div class="stoolbar">

                    <input type="text" placeholder="Filename" id="filename">
                    <select onchange="fileHandle(this.value); this.selectedIndex=0">

        </div>

        <div id="sidebar">
        <div class="sidebar-icons" id="sidebar-screen">
                <div class="desktopApps">
                    <img id="nasaapp" src="nasa.png">
                </div>
                <div class="desktopApps">
                    <img id="timerapp" src="timer.png">
                </div>
        </div>
    </div>

    <div id="topbar">
        <div id="logo-space"><img src="favicon.png" id="logo"></div>
        <div id="time-space"><p id="time">6/21/2023 3:41 PM</p></div>


    <script src="script.js"></script>
</body>
</html>
